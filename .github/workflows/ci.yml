name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  gate:
    needs: [checks, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed
        run: |
          set -e
          for r in \
            "${{ needs.checks.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.e2e.result }}"
          do
            case "$r" in
              success) ;;
              skipped) ;;
              *) echo "Upstream job result: $r"; exit 1 ;;
            esac
          done

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1
          include-hidden-files: true

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - mobile-chrome
          - mobile-safari
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || matrix.project == 'chromium'
        run: npm ci

      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request' || matrix.project == 'chromium'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright dependencies
        if: (steps.playwright-cache.outputs.cache-hit == 'true') && (github.event_name != 'pull_request' || matrix.project == 'chromium')
        run: npx playwright install-deps

      - name: Install Playwright browsers
        if: (steps.playwright-cache.outputs.cache-hit != 'true') && (github.event_name != 'pull_request' || matrix.project == 'chromium')
        run: npx playwright install --with-deps

      - name: Download build artifact
        if: github.event_name != 'pull_request' || matrix.project == 'chromium'
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Run E2E tests
        if: github.event_name != 'pull_request' || matrix.project == 'chromium'
        run: npx playwright test --project=${{ matrix.project }}
        env:
          PW_WORKERS: 2
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Upload Playwright report
        if: failure() && (github.event_name != 'pull_request' || matrix.project == 'chromium')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
